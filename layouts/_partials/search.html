{{- /* Command palette (opened by JS only; a closed <dialog> is never rendered). */ -}}
{{- with site.Home.OutputFormats.Get "json" }}
<dialog class="palette" id="search" aria-label="Search posts" data-index="{{ .RelPermalink }}">
  <form class="palette__form" method="dialog" role="search">
    <label class="palette__prompt" for="search-input"><span aria-hidden="true">$ grep -i</span><span class="sr-only">Search posts</span></label>
    <input class="palette__input" id="search-input" type="text" autocomplete="off" spellcheck="false"
      placeholder="title, tag or topic" role="combobox" aria-expanded="true" aria-controls="search-results"
      aria-autocomplete="list" aria-describedby="search-help">
    <button class="palette__close" type="submit" value="close"><kbd>Esc</kbd><span class="sr-only">Close search</span></button>
  </form>
  <div class="palette__results" id="search-results" role="listbox" aria-label="Results"></div>
  <p class="palette__status sr-only" role="status" aria-live="polite"></p>
  <p class="palette__foot" id="search-help"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></p>
</dialog>
{{- end }}
