{{ define "main" }}
<section class="notfound" aria-labelledby="notfound-title">
  <div class="notfound__copy">
    <p class="notfound__code" aria-hidden="true">404</p>
    <h1 id="notfound-title">Page not found</h1>
    <p class="notfound__text">This page does not exist. It may have moved, or the link may be mistyped.</p>
    <ul class="notfound__links">
      <li><a class="btn btn--primary" href="{{ site.Home.RelPermalink }}">Go to the home page</a></li>
      <li><a class="link-quiet" href="{{ (site.GetPage "/posts").RelPermalink }}">Browse all posts</a></li>
      <li class="js-only"><button class="link-quiet" type="button" data-search-open>Search the blog</button></li>
    </ul>
  </div>
</section>
{{ end }}
