# Conference talks and workshops, newest first.
# Generated by scripts/sync_talks.py from https://github.com/chvancooten/conferences: the folder names
# ("YYYY-MM - Title @ Event"), each folder's talk.toml if it has one, and otherwise the first YouTube link in its
# README.md and a subtitle found in the README's first heading or a slide PDF's name. Do not edit this file by
# hand; manual fields go in data/talks_overrides.toml, keyed by folder name.
# event: the event without its year (the date gives it). location: where it took place. livestream = true: listed on
# the home page only when there is room. featured = true: always listed on the home page. url: the folder. repo and
# repo_label: a related repository and the text of its link. video: the recording. slides: the slide file.

