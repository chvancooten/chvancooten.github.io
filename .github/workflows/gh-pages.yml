# Build, check and publish casvancooten.com to the gh-pages branch
# (GitHub Pages "deploy from branch", custom domain).
#
# - Every PR event except "closed", drafts and forks included: build + scripts/check_site.py
#   with a read-only token. A failing check blocks any deploy.
# - Same-repo, non-draft PRs not opened by Dependabot: preview at
#   https://casvancooten.com/pr-preview/pr-<N>/ plus one sticky PR comment.
# - PR closed (merged or not): pr-preview/pr-<N>/ is removed.
# - Push to main, a manual run on main, or the weekly schedule (which GitHub
#   runs on main): production deploy to the branch root. Existing pr-preview/
#   directories are kept. The deploy is skipped when main has moved past the
#   commit this run built (for example a re-run of an old run). Afterwards,
#   previews of PRs that are no longer open are pruned.
# - Every build first refreshes data/talks.toml from the public
#   chvancooten/conferences repository (scripts/sync_talks.py, read-only
#   token). A failed sync only warns: the build then uses the committed file.
#   The weekly run picks up new talks and recordings without a commit here.
#
# All writes to gh-pages go through scripts/deploy-gh-pages.sh. After a production
# or preview deploy, scripts/purge-cloudflare.sh waits for GitHub Pages to serve
# it and purges Cloudflare's cache (once the zone id and token are configured).
name: github pages

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC: rebuild and redeploy production with fresh talks

permissions: {}

# One group per PR: a new push cancels the PR's older in-progress run, but a
# "closed" run never cancels anything, so a deploy in flight finishes before
# its cleanup. Production has its own group that never cancels a run in
# progress (scheduled runs are on main, so they queue there too). Manual runs on
# other branches get a group per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'production' || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TZ: Europe/Amsterdam
      SITE_URL: https://casvancooten.com/
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HUGO_VERSION: 0.167.0
      # SHA-256 of hugo_extended_0.167.0_linux-amd64.tar.gz, from hugo_0.167.0_checksums.txt.
      # Update both values together.
      HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # enableGitInfo drives .Lastmod, so Hugo needs the full history
          submodules: false
          persist-credentials: false

      - name: Install Hugo
        run: |
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o hugo_checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          if ! grep -qxF "${HUGO_SHA256}  ${tarball}" hugo_checksums.txt; then
            echo "::error::HUGO_SHA256 does not match the release checksums file"
            exit 1
          fi
          sha256sum --check --strict <<< "${HUGO_SHA256}  ${tarball}"
          mkdir hugo-bin
          tar -xzf "$tarball" -C hugo-bin hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
          hugo-bin/hugo version

      - name: Configure git for Hugo GitInfo
        run: git config core.quotepath false

      # Speaking: refresh data/talks.toml from chvancooten/conferences. This
      # step never fails the build: when the sync fails, it warns and the build
      # uses the committed file. The job summary says whether the synced data
      # differs from the committed file.
      - name: Sync talks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          timeout 180 python3 scripts/sync_talks.py > "$RUNNER_TEMP/sync-talks.out" || status=$?
          cat "$RUNNER_TEMP/sync-talks.out"
          if [[ "$status" -ne 0 ]]; then
            git checkout -- data/talks.toml
            rm -f data/.talks-*.toml
            echo "::warning title=Talks sync failed::scripts/sync_talks.py exited with status ${status}. This build uses the committed data/talks.toml."
            result="The sync failed (exit status ${status}), so this build uses the committed \`data/talks.toml\`."
          elif git diff --quiet -- data/talks.toml; then
            result="The synced data is the same as the committed \`data/talks.toml\`."
          else
            git --no-pager diff --stat -- data/talks.toml
            git --no-pager diff -- data/talks.toml
            read -r added removed _ < <(git diff --numstat -- data/talks.toml) || true
            result="The synced data differs from the committed \`data/talks.toml\` (+${added} -${removed} lines), and this build uses it. Run \`python3 scripts/sync_talks.py\` and commit the file to keep the repository in step."
          fi
          {
            echo "### Talks sync"
            echo
            echo "$result"
            if [[ "$status" -eq 0 ]]; then
              echo
              tail -n 1 "$RUNNER_TEMP/sync-talks.out"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (production)
        if: github.event_name != 'pull_request'
        run: hugo --gc --minify --panicOnWarning --baseURL "$SITE_URL"

      - name: Check (production)
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_site.py public --site-url "$SITE_URL"

      - name: Build (preview)
        if: github.event_name == 'pull_request'
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::unexpected PR number"; exit 1; }
          HUGO_PARAMS_PREVIEWPR="$PR_NUMBER" hugo --gc --minify --panicOnWarning \
            --environment preview --baseURL "${SITE_URL}pr-preview/pr-${PR_NUMBER}/"

      - name: Check (preview)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_site.py public --site-url "${SITE_URL}pr-preview/pr-${PR_NUMBER}/" --preview

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: Deploy PR preview
    needs: build
    # Trusted PRs only: same repository (not a fork), not a draft, and not
    # Dependabot (its token is read-only). The build job above still checks the rest.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: ${{ runner.temp }}/site

      - name: Publish to pr-preview/pr-N
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/deploy-gh-pages.sh preview "$PR_NUMBER" "$RUNNER_TEMP/site"

      - name: Post or update the preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- gh-pages-pr-preview -->';
            const pr = context.payload.pull_request;
            const url = `https://casvancooten.com/pr-preview/pr-${pr.number}/`;
            const body = [
              marker,
              '**Preview deployed**',
              '',
              url,
              '',
              `Built from ${pr.head.sha.slice(0, 7)}. GitHub Pages usually publishes it within a few minutes.`,
              'The preview is `noindex` and is removed when this PR is closed.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

      # Last, so a failed purge never holds up the deploy, and whenever the publish
      # succeeded, even if a step after it failed. Skipped with a notice until the
      # CLOUDFLARE_ZONE_ID variable and the CLOUDFLARE_API_TOKEN secret exist.
      - name: Purge the Cloudflare cache
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/purge-cloudflare.sh "$RUNNER_TEMP/site" "/pr-preview/pr-$PR_NUMBER/"

  deploy-production:
    name: Deploy production
    needs: build
    # Only this repository deploys production: a fork with Actions enabled
    # builds and checks, but never publishes.
    if: >-
      github.repository == 'chvancooten/chvancooten.github.io'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read # list open PRs to prune stale previews
    steps:
      - name: Check out the deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # Re-running an old run (or a manual or scheduled run after main moved
      # on) must not publish an older commit over a newer one. A scheduled run
      # builds the tip of main when it starts, so the same check holds for it.
      - name: Check that this run built the tip of main
        id: tip
        run: |
          # Match the ref name exactly: ls-remote patterns also match any ref
          # that merely ends in refs/heads/main.
          main_sha=$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" {print $1}')
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve refs/heads/main on origin to a single commit"
            exit 1
          fi
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has a newer commit (${main_sha:0:12}) than the one this run built (${GITHUB_SHA:0:12}), so this run does not deploy. The run for that newer commit publishes it. If that run did not deploy, start this workflow manually (workflow_dispatch) on main to republish main."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: ${{ runner.temp }}/site

      - name: Publish to the gh-pages root
        id: publish
        if: steps.tip.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/deploy-gh-pages.sh production "$RUNNER_TEMP/site"

      # Backstop for previews whose cleanup never ran (GitHub skips pull_request
      # workflows for PRs with merge conflicts) or failed. If the lookup fails,
      # nothing is pruned.
      - name: List open PRs
        id: open-prs
        if: steps.tip.outputs.current == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const numbers = prs.map((p) => p.number);
            if (!numbers.every((n) => Number.isInteger(n) && n > 0)) {
              throw new Error('Unexpected PR number in the API response');
            }
            core.info(`Open PRs: ${numbers.join(', ') || 'none'}`);
            return numbers.length > 0 ? numbers.join(' ') : 'none';

      - name: Prune previews of closed PRs
        if: steps.open-prs.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEN_PRS: ${{ steps.open-prs.outputs.result }}
        run: |
          read -r -a open_prs <<< "$OPEN_PRS"
          scripts/deploy-gh-pages.sh prune "${open_prs[@]}"

      - name: Report skipped pruning
        if: steps.tip.outputs.current == 'true' && steps.open-prs.outcome != 'success'
        run: echo "::warning::Could not list open PRs, so no previews were pruned"

      # Last, so a failed purge never holds up the deploy, and whenever the publish
      # succeeded, even if a step after it failed. Skipped with a notice until the
      # CLOUDFLARE_ZONE_ID variable and the CLOUDFLARE_API_TOKEN secret exist.
      - name: Purge the Cloudflare cache
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/purge-cloudflare.sh "$RUNNER_TEMP/site" /

  cleanup-preview:
    name: Remove PR preview
    # Same trust rule as deploy-preview, minus the draft check: a PR that had a
    # preview and was turned back into a draft still gets cleaned up.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Remove pr-preview/pr-N
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/deploy-gh-pages.sh cleanup "$PR_NUMBER"

      - name: Update the preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- gh-pages-pr-preview -->';
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );
            if (!existing) {
              core.info('No preview comment on this PR; nothing to update.');
              return;
            }
            const body = [
              marker,
              '**Preview removed**',
              '',
              `The preview for this PR was removed from gh-pages when the PR was ${pr.merged ? 'merged' : 'closed'}.`,
            ].join('\n');
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
